# Configuration de déploiement Netlify pour Docta na Tshombo
[build]
  publish = "."

[[headers]]
  for = "/apk/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"docta-na-tshombo.apk\""
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
